[package]
name = "omatalk"
version = "0.9.0"
edition = "2024"
license = "MIT"
description = "Local text-to-speech for Omarchy: hotkey, and the machine speaks your selected text."

# One crate, one binary. `omatalk daemon` is the Daemon; every other argv is the CLI.
[[bin]]
name = "omatalk"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "api-27"] }
libloading = "0.8"
fancy-regex = "0.19"
unicode-normalization = "0.1"
npyz = { version = "0.9", features = ["npz"] }

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
scraper = "0.27"
