name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - public/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev pytest tests/ -q
