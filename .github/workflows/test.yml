name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # No onnxruntime or espeak-ng here: the Daemon dlopens them, and the
      # fake engine (OMATALK_TEST_FAKE_ENGINE) covers it in these tests.
      - run: make lint
      - run: make test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QML test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qttest \
            qml6-module-qtquick-window \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            libgl1 \
            libegl1
      - run: make test-plugin
