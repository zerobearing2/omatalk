name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # No onnxruntime or espeak-ng here: the Daemon dlopens them, and the
      # fake engine (OMATALK_TEST_FAKE_ENGINE) covers it in these tests.
      - run: make lint
      - run: make test
