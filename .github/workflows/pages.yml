name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - public/**
      - install.sh
      - uninstall.sh
      - .github/workflows/pages.yml
  # Re-deploy after each release so the site mirrors the latest tarball.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Mirror installer scripts
        run: cp install.sh uninstall.sh public/
      - name: Mirror latest release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "omatalk-src.tar.gz*" --clobber --dir public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
