name: Deploy site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release event can fire before releases/latest settles, so a
          # mismatch is re-read a few times before it counts.
          latest=""
          for attempt in 1 2 3 4 5; do
            if latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"; then
              if [ "$latest" = "$TAG" ]; then
                break
              fi
            fi
            sleep 3
          done
          if [ -z "$latest" ]; then
            echo "could not read releases/latest" >&2
            exit 1
          fi
          if [ "$latest" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is not the latest release ($latest); the site stays as it is."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
