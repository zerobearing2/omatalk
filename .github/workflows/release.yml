name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - public/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev pytest tests/ -q
  release:
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version (auto-bump patch to the first free tag)
        id: ver
        run: |
          # The tag is the version record; nothing is committed back to the
          # branch, so pushes never race the bot. Bump the patch until the
          # tag is free — a single bump can land on an existing tag after a
          # reset, wedging every future release.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
          while git ls-remote --tags origin "refs/tags/v$version" | grep -q "refs/tags/v$version"; do
            patch=$((patch + 1))
            version="$major.$minor.$patch"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack source tarball
        run: |
          # Runtime minimum only: package, service unit, build metadata,
          # README (referenced by pyproject), uninstaller, bar plugin.
          # No site, tests, docs, or CI config. The resolved version is
          # written into the packed pyproject so the tarball self-describes.
          sed "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" \
            pyproject.toml > /tmp/pyproject.toml && mv /tmp/pyproject.toml pyproject.toml
          tar --transform "s,^,omatalk/," \
            -czf omatalk-src.tar.gz \
            omatalk systemd plugin pyproject.toml README.md uninstall.sh
          sha256sum omatalk-src.tar.gz > omatalk-src.tar.gz.sha256
      - name: Create or update release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" --title "$tag" --generate-notes \
            omatalk-src.tar.gz omatalk-src.tar.gz.sha256 \
            || gh release upload "$tag" --clobber \
              omatalk-src.tar.gz omatalk-src.tar.gz.sha256
