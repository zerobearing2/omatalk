name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - public/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev pytest tests/ -q
  release:
    needs: test
    # Manual only: pushes to master run tests but no longer cut a release on
    # their own, so several PRs can land before anyone decides to ship.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pyproject.toml
        id: ver
        run: |
          # pyproject.toml's committed version is the single source of
          # truth — bump it with `make bump` (which also commits) before
          # triggering this workflow. Refusing a stale/reused version here
          # catches the "forgot to bump" case instead of silently reusing or
          # clobbering a prior release's tag.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if git ls-remote --tags origin "refs/tags/v$version" | grep -q "refs/tags/v$version"; then
            echo "v$version already exists — bump pyproject.toml's version first (make bump)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack source tarball
        run: |
          # Runtime minimum only: package, service unit, build metadata,
          # README (referenced by pyproject), uninstaller.
          # No site, tests, docs, CI config, or bar plugin (that is
          # zerobearing2/omarchy-omatalk-plugin).
          tar --transform "s,^,omatalk/," \
            -czf omatalk-src.tar.gz \
            omatalk systemd pyproject.toml README.md uninstall.sh
          sha256sum omatalk-src.tar.gz > omatalk-src.tar.gz.sha256
      - name: Create or update release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # install.sh/uninstall.sh are also uploaded standalone (not just
          # inside the tarball) so the site's thin dispatcher
          # (public/install.sh, public/uninstall.sh) can fetch
          # releases/latest/download/<script> directly — pinning the
          # installer's own logic to the release it ships, not to master.
          gh release create "$tag" --title "$tag" --generate-notes \
            omatalk-src.tar.gz omatalk-src.tar.gz.sha256 install.sh uninstall.sh \
            || gh release upload "$tag" --clobber \
              omatalk-src.tar.gz omatalk-src.tar.gz.sha256 install.sh uninstall.sh
