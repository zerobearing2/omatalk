[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omatalk"
version = "0.2.2"
description = "Local text-to-speech for Omarchy: hotkey, and the machine speaks your selected text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "kokoro-onnx>=0.6,<0.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
omatalk = "daemon.cli:main"
omatalkd = "daemon.omatalkd:serve"

[tool.setuptools]
packages = ["daemon"]
